<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PoppyJeans | Iniciar Sesión</title>
    <!-- Favicon -->
    <link rel="icon" href="../favicon.png" type="image/png">

    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
        rel="stylesheet">

    <style>
        /* --- STUDIO PIXEL TOKENS --- */
        :root {
            --blanco-puro: #FFFFFF;
            --fondo-claro: #fcf9f9;
            --teal-studio: #8a4d4e;
            --teal-claro: #ffdad9;
            --dark-studio: #211a19;
            --gris-claro: #eedfdd;
            --danger-color: #ba1a1a;
            --danger-light: #ffdad6;

            --font-main: 'Plus Jakarta Sans', sans-serif;
            --font-display: 'Playfair Display', serif;

            --radius-md: 12px;
            --radius-lg: 24px;
            --radius-pill: 50px;

            --transition-smooth: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--fondo-claro);
            color: var(--dark-studio);
        }

        /* --- LOGIN VIEW --- */
        #loginView {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--dark-studio) 0%, #2a2a35 100%);
        }

        .login-card {
            background: var(--blanco-puro);
            padding: 3rem;
            border-radius: var(--radius-md);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .login-logo {
            font-family: var(--font-display);
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--dark-studio);
            margin-bottom: 2rem;
        }

        .login-logo span {
            color: var(--teal-studio);
        }

        .input-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #666;
        }

        .input-group input[type="email"],
        .input-group input[type="password"] {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 1px solid var(--gris-claro);
            border-radius: 8px;
            font-family: var(--font-main);
            font-size: 0.95rem;
            outline: none;
            transition: var(--transition-smooth);
            background: var(--fondo-claro);
        }

        .input-group input:focus {
            border-color: var(--teal-studio);
            background: var(--blanco-puro);
            box-shadow: 0 0 0 3px var(--teal-claro);
        }

        .btn-primary {
            width: 100%;
            background: var(--teal-studio);
            color: var(--blanco-puro);
            border: none;
            padding: 1rem;
            border-radius: 8px;
            font-family: var(--font-main);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition-smooth);
        }

        .btn-primary:hover {
            background: #10a89b;
            transform: translateY(-2px);
        }

        .error-msg {
            color: var(--danger-color);
            font-size: 0.85rem;
            margin-top: 1rem;
            display: none;
        }
    </style>
</head>

<body>

    <div id="loginView">
        <div class="login-card">
            <div class="login-logo" style="display: flex; align-items: center; justify-content: center; gap: 0.75rem; margin-bottom: 1.5rem;">
                <img src="../poppyjeanslogo.png" alt="Poppy Jeans" style="width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid #8a4d4e;">
                <img src="../media/poppyjeans_logo_script.png" alt="Poppy Jeans" style="height: 28px; object-fit: contain;">
            </div>
            <p style="color: #888; margin-bottom: 2rem; font-size: 0.9rem;">Ingresa tus credenciales para acceder al
                panel corporativo.</p>
            <form id="loginForm">
                <div class="input-group">
                    <label>Correo Electrónico</label>
                    <input type="email" id="loginEmail" required placeholder="admin@poppyjeans.cl"
                        value="admin@poppyjeans.cl">
                </div>
                <div class="input-group">
                    <label>Contraseña</label>
                    <input type="password" id="loginPassword" required placeholder="Ingresa tu contraseña">
                </div>
                <button type="submit" class="btn-primary" id="loginBtnText">Iniciar Sesión</button>
                <div id="loginError" class="error-msg">Credenciales incorrectas. Intenta nuevamente.</div>
            </form>
        </div>
    </div>

    <!-- ✅ AUTH HELPER v2.0 - Sesiones seguras con token UUID -->
    <script>
        const API_BASE_URL = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
            ? 'http://localhost:8788'
            : 'https://api.poppyjeans.cl';

        const loginForm = document.getElementById('loginForm');

        window.onload = () => {
            const urlParams = new URLSearchParams(window.location.search);
            const wasExpired = urlParams.get('expired') === 'true';
            const wasLoggedOut = urlParams.get('logout') === 'true';

            if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
                if (!wasExpired && !wasLoggedOut) {
                    localStorage.setItem('admin_token', 'd13e7947-618c-4c8e-b069-2698e5c94b93-5f7e98fb-00b7-45e0-b20f-115d067bf77d');
                    localStorage.setItem('admin_name', 'Studio Pixel');
                    localStorage.setItem('admin_rol', 'superadmin');
                } else {
                    localStorage.removeItem('admin_token');
                }
            }
            const token = localStorage.getItem('admin_token');
            if (token) {
                // Redirigir directamente a la pantalla de inventario si ya está autenticado
                window.location.href = 'inventario.html';
            }
        };

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            document.getElementById('loginError').style.display = 'none';
            document.getElementById('loginBtnText').textContent = 'Conectando...';

            try {
                const response = await fetch(`${API_BASE_URL}/api/admin/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: document.getElementById('loginEmail').value,
                        password: document.getElementById('loginPassword').value
                    })
                });
                const result = await response.json();

                if (result.success) {
                    localStorage.setItem('admin_token', result.token);
                    localStorage.setItem('admin_name', result.admin_data.nombre);
                    localStorage.setItem('admin_rol', result.admin_data.rol);
                    window.location.href = 'inventario.html';
                } else {
                    document.getElementById('loginError').textContent = result.error || 'Credenciales incorrectas.';
                    document.getElementById('loginError').style.display = 'block';
                }
            } catch (error) {
                document.getElementById('loginError').textContent = 'Error de conexión con el servidor.';
                document.getElementById('loginError').style.display = 'block';
            } finally {
                document.getElementById('loginBtnText').textContent = 'Iniciar Sesión';
            }
        });
    </script>

</body>

</html>
