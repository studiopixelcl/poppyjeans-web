<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zodia - El Akasha</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="profile-page">
    <div class="space-background"></div>
    <div class="stars-overlay"></div>

    <!-- Navegación Superior -->
    <nav class="top-nav">
        <div class="nav-container">
            <div class="nav-logo">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--accent-cyan)" stroke-width="1.5">
                    <path d="M12 3L3 19h18L12 3z"/>
                    <path d="M12 21L3 5h18L12 21z" opacity="0.3"/>
                    <circle cx="12" cy="12" r="1.5" fill="var(--accent-cyan)"/>
                </svg>
                <span class="nav-title">ZODIA</span>
            </div>
            <nav class="nav-links">
                <a href="inicio.html" class="active">🌌 Inicio</a>
                <a href="mensajes.html">✉️ Mensajes</a>
                <a href="oraculo.html">🔮 Oráculo</a>
                <a href="perfil.html">✦ Santuario</a>
            </nav>
            <span id="topbarHello" style="font-size:.75rem; color:var(--text-muted); letter-spacing:.1em; text-transform:uppercase;"></span>
        </div>
    </nav>

    <div class="profile-wrapper animate-fade-up">
        <main class="profile-feed" style="width:100%;">

            <!-- Creador de Publicaciones -->
            <div class="post-creator-card">
                <div class="creator-header">
                    <div class="creator-avatar">
                        <img id="creatorAvatar" src="" alt="Avatar" style="object-fit: cover;">
                    </div>
                    <textarea id="postContent" placeholder="¿Qué frecuencia o tránsito planetario experimentas hoy, Iniciado?" maxlength="400"></textarea>
                </div>
                <div class="creator-footer">
                    <span class="char-counter"><span id="charCount">0</span>/400</span>
                    <button id="btnPublish" class="btn btn-glow" style="min-height: 38px; width: auto; padding: 0 1.5rem; font-size: 0.75rem;">Proyectar</button>
                </div>
            </div>

            <!-- Feed -->
            <div id="feedContainer" class="feed-container"></div>

        </main>
    </div>

    <!-- Menú Inferior -->
    <nav class="bottom-nav">
        <a href="inicio.html" class="bottom-nav-item active" aria-label="Inicio">
            <span class="nav-icon">🌌</span>
            <span class="nav-label">Inicio</span>
        </a>
        <a href="mensajes.html" class="bottom-nav-item" aria-label="Mensajes">
            <span class="nav-icon">✉️</span>
            <span class="nav-label">Mensajes</span>
        </a>
        <a href="oraculo.html" class="bottom-nav-item" aria-label="Oráculo">
            <span class="nav-icon">🔮</span>
            <span class="nav-label">Oráculo</span>
        </a>
        <a href="perfil.html" class="bottom-nav-item" aria-label="Santuario">
            <span class="nav-icon">✦</span>
            <span class="nav-label">Santuario</span>
        </a>
    </nav>

    <script src="js/inicio.js"></script>
</body>
</html>
