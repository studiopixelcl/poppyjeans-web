<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zodia - Hilos del Destino</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="profile-page messages-page">
    <div class="space-background"></div>
    <div class="stars-overlay"></div>

    <!-- Navegación Superior -->
    <nav class="top-nav">
        <div class="nav-container">
            <div class="nav-logo">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--accent-cyan)" stroke-width="1.5">
                    <path d="M12 3L3 19h18L12 3z"/>
                    <path d="M12 21L3 5h18L12 21z" opacity="0.3"/>
                    <circle cx="12" cy="12" r="1.5" fill="var(--accent-cyan)"/>
                </svg>
                <span class="nav-title">ZODIA</span>
            </div>
            <nav class="nav-links">
                <a href="inicio.html">🌌 Inicio</a>
                <a href="mensajes.html" class="active">✉️ Mensajes</a>
                <a href="oraculo.html">🔮 Oráculo</a>
                <a href="perfil.html">✦ Santuario</a>
            </nav>
            <span id="topbarHello"
                  style="font-size:.75rem; color:var(--text-muted);
                         letter-spacing:.1em; text-transform:uppercase;"></span>
        </div>
    </nav>

    <!-- Layout principal: 2 columnas en desktop, 1 en móvil -->
    <div class="messages-layout" id="messagesLayout">

        <!-- ── Panel Izquierdo: Bandeja de entrada ── -->
        <aside class="inbox-panel" id="inboxPanel">
            <div class="inbox-header">
                <h2 class="inbox-title">Hilos del Destino</h2>
                <p class="inbox-subtitle">Conversaciones activas</p>
            </div>
            <div class="inbox-list" id="inboxList">
                <p class="inbox-loading">Sintonizando…</p>
            </div>
        </aside>

        <!-- ── Panel Derecho: Conversación activa ── -->
        <main class="chat-panel" id="chatPanel">

            <!-- Header del chat (oculto hasta abrir conversación) -->
            <div class="chat-header" id="chatHeader" hidden>
                <button class="chat-back-btn" id="btnBackToInbox" aria-label="Volver a conversaciones">←</button>
                <img id="chatBuddyAvatar"
                     class="chat-header-avatar"
                     src=""
                     alt=""
                     style="object-fit:cover;">
                <div class="chat-header-info">
                    <span id="chatBuddyName" class="chat-buddy-name">—</span>
                    <span id="chatBuddySign" class="chat-buddy-sign">—</span>
                </div>
            </div>

            <!-- Área de mensajes -->
            <div class="chat-messages" id="chatMessages">
                <div class="chat-empty" id="chatEmpty">
                    <div class="chat-empty-glyph">⟁</div>
                    <p>Selecciona una sintonía activa<br>o inicia una nueva desde el Espejo Astral</p>
                </div>
            </div>

            <!-- Compositor (oculto hasta abrir conversación) -->
            <div class="chat-composer" id="chatComposer" hidden>
                <textarea
                    id="chatInput"
                    class="chat-input"
                    placeholder="Escribe tu mensaje… (Ctrl+↵ para enviar)"
                    maxlength="500"
                    rows="1"></textarea>
                <button id="btnSendMessage" class="btn-send-msg" aria-label="Enviar mensaje">↑</button>
            </div>

        </main>
    </div>

    <!-- Menú Inferior -->
    <nav class="bottom-nav">
        <a href="inicio.html" class="bottom-nav-item" aria-label="Inicio">
            <span class="nav-icon">🌌</span>
            <span class="nav-label">Inicio</span>
        </a>
        <a href="mensajes.html" class="bottom-nav-item active" aria-label="Mensajes">
            <span class="nav-icon">✉️</span>
            <span class="nav-label">Mensajes</span>
        </a>
        <a href="oraculo.html" class="bottom-nav-item" aria-label="Oráculo">
            <span class="nav-icon">🔮</span>
            <span class="nav-label">Oráculo</span>
        </a>
        <a href="perfil.html" class="bottom-nav-item" aria-label="Santuario">
            <span class="nav-icon">✦</span>
            <span class="nav-label">Santuario</span>
        </a>
    </nav>

    <script src="js/messages.js"></script>
</body>
</html>
