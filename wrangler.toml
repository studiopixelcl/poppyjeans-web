name = "poppyjeans-api"
main = "src/index.js"
compatibility_date = "2024-04-08"

[dev]
port = 8788


[[d1_databases]]
binding = "DB"
database_name = "poppyjeans-db"
database_id = "c203d4ec-5494-462f-9e79-81bf81d9e5bb"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "poppyjeans-images"

[vars]
PUBLIC_IMAGES_URL = "https://images.poppyjeans.cl"

routes = [
  { pattern = "api.poppyjeans.cl", custom_domain = true }
]